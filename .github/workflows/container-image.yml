name: SnagTime container image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests only build and scan. Publishing is possible only from the
# protected repository's main branch and uses the ephemeral GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: snagtime-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
        ports:
          - 5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: snagtime_ci
        options: --health-cmd "pg_isready -U postgres -d snagtime_ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Generate ephemeral CI secret material
        shell: bash
        run: |
          set -euo pipefail
          mask_and_export() {
            local name="$1" value="$2"
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          }
          random_secret() { openssl rand -hex 32; }
          auth_secret=$(random_secret); mask_and_export AUTH_SECRET "$auth_secret"
          booking_secret=$(random_secret); mask_and_export BOOKING_CAPABILITY_SECRET "$booking_secret"
          rate_secret=$(random_secret); mask_and_export RATE_LIMIT_HASH_SECRET "$rate_secret"
          tenant_secret=$(random_secret); mask_and_export TENANT_CONTEXT_SECRET "$tenant_secret"
          token_key=$(openssl rand -hex 32); mask_and_export TOKEN_ENCRYPTION_KEY "$token_key"
          proxy_secret=$(random_secret); mask_and_export PROXY_SHARED_SECRET "$proxy_secret"
          operator_secret=$(random_secret); mask_and_export OPERATOR_HEALTH_SECRET "$operator_secret"
          google_secret=$(random_secret); mask_and_export GOOGLE_CLIENT_SECRET "$google_secret"
          email_secret=$(random_secret); mask_and_export EMAIL_TOKEN_SECRET "$email_secret"
          blockwise_secret=$(random_secret); mask_and_export BLOCKWISE_WEBHOOK_SECRET "$blockwise_secret"
          action_secret=$(random_secret); mask_and_export BLOCKWISE_BOOKING_ACTION_SECRET "$action_secret"
          stripe_secret="sk_test_$(openssl rand -hex 24)"; mask_and_export STRIPE_SECRET_KEY "$stripe_secret"
          stripe_webhook="whsec_$(openssl rand -hex 24)"; mask_and_export STRIPE_WEBHOOK_SECRET "$stripe_webhook"
          smtp_password=$(random_secret); mask_and_export SMTP_PASSWORD "$smtp_password"
          app_db_password=$(random_secret); mask_and_export TEMPOCOVE_APP_DB_PASSWORD "$app_db_password"
          worker_db_password=$(random_secret); mask_and_export TEMPOCOVE_WORKER_DB_PASSWORD "$worker_db_password"
          monitor_db_password=$(random_secret); mask_and_export TEMPOCOVE_MONITOR_DB_PASSWORD "$monitor_db_password"
          migration_db_password=$(random_secret); mask_and_export TEMPOCOVE_MIGRATION_DB_PASSWORD "$migration_db_password"
          port='${{ job.services.postgres.ports[5432] }}'
          database_url="postgresql://postgres@127.0.0.1:${port}/snagtime_ci?sslmode=verify-full&sslrootcert=${GITHUB_WORKSPACE}/ci-certs/ca.crt&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000"
          container_database_url="postgresql://postgres@postgres:5432/snagtime_ci?sslmode=verify-full&sslrootcert=/workspace/ci-certs/ca.crt&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000"
          url_prefix='postgresql://'; url_separator=':'; url_at='@'
          worker_database_url=$(printf '%s%s%s%s%s127.0.0.1:%s%s' "$url_prefix" 'tempocove_worker_login' "$url_separator" "$worker_db_password" "$url_at" "$port" '/snagtime_ci?sslmode=verify-full&sslrootcert='"${GITHUB_WORKSPACE}"'/ci-certs/ca.crt&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000')
          container_worker_database_url=$(printf '%s%s%s%s%s%s' "$url_prefix" 'tempocove_worker_login' "$url_separator" "$worker_db_password" "$url_at" 'postgres:5432/snagtime_ci?sslmode=verify-full&sslrootcert=/workspace/ci-certs/ca.crt&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000')
          container_app_database_url=$(printf '%s%s%s%s%s%s' "$url_prefix" 'tempocove_app_login' "$url_separator" "$app_db_password" "$url_at" 'postgres:5432/snagtime_ci?sslmode=verify-full&sslrootcert=/run/secrets/ci-ca&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000')
          container_monitor_database_url=$(printf '%s%s%s%s%s%s' "$url_prefix" 'tempocove_monitor_login' "$url_separator" "$monitor_db_password" "$url_at" 'postgres:5432/snagtime_ci?sslmode=verify-full&sslrootcert=/run/secrets/ci-ca&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000')
          booking_keyring=$(printf '{"ci-booking-v1":"%s"}' "$booking_secret")
          mask_and_export DATABASE_URL "$database_url"
          mask_and_export CONTAINER_DATABASE_URL "$container_database_url"
          mask_and_export WORKER_DATABASE_URL "$worker_database_url"
          mask_and_export CONTAINER_WORKER_DATABASE_URL "$container_worker_database_url"
          mask_and_export CONTAINER_APP_DATABASE_URL "$container_app_database_url"
          mask_and_export CONTAINER_MONITOR_DATABASE_URL "$container_monitor_database_url"
          mask_and_export BOOKING_CAPABILITY_KEYRING "$booking_keyring"

      - name: Prepare TLS PostgreSQL and production schema
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          mkdir -p ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ci-certs/ca.key -out ci-certs/ca.crt -subj '/CN=SnagTime CI CA'
          openssl req -newkey rsa:2048 -nodes -keyout ci-certs/server.key -out ci-certs/server.csr -subj '/CN=postgres'
          printf 'subjectAltName=DNS:postgres,DNS:localhost,IP:127.0.0.1\n' > ci-certs/server.ext
          openssl x509 -req -in ci-certs/server.csr -CA ci-certs/ca.crt -CAkey ci-certs/ca.key -CAcreateserial -out ci-certs/server.crt -days 1 -sha256 -extfile ci-certs/server.ext
          chmod 600 ci-certs/server.key ci-certs/ca.key
          docker cp ci-certs/server.crt "$PG_CONTAINER":/var/lib/postgresql/server.crt
          docker cp ci-certs/server.key "$PG_CONTAINER":/var/lib/postgresql/server.key
          docker exec "$PG_CONTAINER" chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          docker exec "$PG_CONTAINER" chmod 600 /var/lib/postgresql/server.key
          docker exec "$PG_CONTAINER" psql -U postgres -d snagtime_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec "$PG_CONTAINER" psql -U postgres -d snagtime_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'"
          docker exec "$PG_CONTAINER" psql -U postgres -d snagtime_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'"
          docker restart "$PG_CONTAINER" >/dev/null
          for attempt in $(seq 1 20); do docker exec "$PG_CONTAINER" pg_isready -U postgres -d snagtime_ci && break || sleep 1; done
          network=$(docker inspect "$PG_CONTAINER" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')
          prep_env=$(mktemp)
          chmod 600 "$prep_env"
          trap 'rm -f "$prep_env"' EXIT
          {
            printf 'DATABASE_URL=%s\n' "$CONTAINER_DATABASE_URL"
            printf 'WORKER_DATABASE_URL=%s\n' "$CONTAINER_WORKER_DATABASE_URL"
            printf 'TENANT_CONTEXT_SECRET=%s\n' "$TENANT_CONTEXT_SECRET"
            printf 'TEMPOCOVE_APP_DB_PASSWORD=%s\n' "$TEMPOCOVE_APP_DB_PASSWORD"
            printf 'TEMPOCOVE_WORKER_DB_PASSWORD=%s\n' "$TEMPOCOVE_WORKER_DB_PASSWORD"
            printf 'TEMPOCOVE_MONITOR_DB_PASSWORD=%s\n' "$TEMPOCOVE_MONITOR_DB_PASSWORD"
            printf 'TEMPOCOVE_MIGRATION_DB_PASSWORD=%s\n' "$TEMPOCOVE_MIGRATION_DB_PASSWORD"
            printf 'PGAPPNAME=%s\n' "$GITHUB_SHA"
          } > "$prep_env"
          docker run --rm --network "$network" \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env-file "$prep_env" \
            node:24.19.0-bookworm-slim@sha256:e5a8dee7bc1e6a215d224a7ef8206f7e77271bc3cabd5febf2beafac0674f174 \
            sh -eu -c 'npm ci --ignore-scripts --no-audit --no-fund && npm run db:generate:postgres && npx prisma migrate deploy --schema prisma/postgresql/schema.prisma && npm run db:provision:postgres-logins && node scripts/ci-heartbeat.mjs'
        working-directory: ${{ github.workspace }}

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Check container image secret contract
        run: npm run ci:container-image-secret-contract

      - name: Build immutable runtime image
        run: |
          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --build-arg BUILD_ID=${GITHUB_SHA} \
            --tag snagtime:${GITHUB_SHA} \
            --target runtime .

      - name: Verify runtime contract
        run: |
          test "$(docker image inspect snagtime:${GITHUB_SHA} --format '{{.Config.User}}')" = '1000:1000'
          test "$(docker image inspect snagtime:${GITHUB_SHA} --format '{{json .Config.Cmd}}')" = '["node","apps/web/server.js"]'
          docker run --rm --entrypoint node snagtime:${GITHUB_SHA} -e "const fs=require('fs'); for (const f of ['apps/web/server.js','dist/worker.mjs','scripts/container-entrypoint.mjs']) { if (!fs.existsSync('/app/'+f)) throw new Error('missing '+f) }"

      - name: Start web runtime and exercise liveness endpoint
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          network=$(docker inspect "$PG_CONTAINER" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')
          heartbeat_env=$(mktemp)
          chmod 600 "$heartbeat_env"
          trap 'rm -f "$heartbeat_env"' EXIT
          printf 'WORKER_DATABASE_URL=%s\n' "$CONTAINER_WORKER_DATABASE_URL" > "$heartbeat_env"
          docker run --rm --network "$network" --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env-file "$heartbeat_env" \
            node:24.19.0-bookworm-slim@sha256:e5a8dee7bc1e6a215d224a7ef8206f7e77271bc3cabd5febf2beafac0674f174 \
            node scripts/ci-heartbeat.mjs
          rm -f "$heartbeat_env"
          trap - EXIT
          secret_dir=$(mktemp -d)
          sudo install -d -o 1000 -g 1000 -m 0700 "$secret_dir"
          sudo install -o 1000 -g 1000 -m 0400 ci-certs/ca.crt "$secret_dir/ci-ca"
          write_secret() { local name="$1" value="$2"; printf '::add-mask::%s\n' "$value"; sudo install -o 1000 -g 1000 -m 0400 /dev/null "$secret_dir/$name"; printf '%s' "$value" | sudo tee "$secret_dir/$name" >/dev/null; sudo chown 1000:1000 "$secret_dir/$name"; sudo chmod 0400 "$secret_dir/$name"; }
          write_secret DATABASE_URL "$CONTAINER_APP_DATABASE_URL"
          write_secret WORKER_DATABASE_URL "$CONTAINER_WORKER_DATABASE_URL"
          write_secret MONITOR_DATABASE_URL "$CONTAINER_MONITOR_DATABASE_URL"
          write_secret AUTH_SECRET "$AUTH_SECRET"
          write_secret BOOKING_CAPABILITY_SECRET "$BOOKING_CAPABILITY_SECRET"
          write_secret BOOKING_CAPABILITY_KEYRING "$BOOKING_CAPABILITY_KEYRING"
          write_secret RATE_LIMIT_HASH_SECRET "$RATE_LIMIT_HASH_SECRET"
          write_secret TENANT_CONTEXT_SECRET "$TENANT_CONTEXT_SECRET"
          write_secret TOKEN_ENCRYPTION_KEY "$TOKEN_ENCRYPTION_KEY"
          write_secret PROXY_SHARED_SECRET "$PROXY_SHARED_SECRET"
          write_secret OPERATOR_HEALTH_SECRET "$OPERATOR_HEALTH_SECRET"
          write_secret GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          write_secret EMAIL_TOKEN_SECRET "$EMAIL_TOKEN_SECRET"
          write_secret BLOCKWISE_WEBHOOK_SECRET "$BLOCKWISE_WEBHOOK_SECRET"
          write_secret BLOCKWISE_BOOKING_ACTION_SECRET "$BLOCKWISE_BOOKING_ACTION_SECRET"
          write_secret STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"
          write_secret STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"
          write_secret SMTP_PASSWORD "$SMTP_PASSWORD"
          secret_volume="snagtime-secrets-${GITHUB_SHA}"
          docker volume create "$secret_volume" >/dev/null
          docker run --rm --user 0 --volume "$secret_volume:/run/secrets" --volume "$secret_dir:/source:ro" snagtime:${GITHUB_SHA} sh -eu -c 'chown 1000:1000 /run/secrets; chmod 0700 /run/secrets; for source in /source/*; do install -o 1000 -g 1000 -m 0400 "$source" "/run/secrets/$(basename "$source")"; done; chown 1000:1000 /run/secrets; chmod 0700 /run/secrets; test "$(stat -c "%u:%g:%a" /run/secrets)" = 1000:1000:700; for secret in /run/secrets/*; do test "$(stat -c "%u:%g:%a" "$secret")" = 1000:1000:400; done'
          docker run --rm --user 1000:1000 --volume "$secret_volume:/run/secrets:ro" \
            --env DATABASE_URL_FILE=/run/secrets/DATABASE_URL --env WORKER_DATABASE_URL_FILE=/run/secrets/WORKER_DATABASE_URL --env MONITOR_DATABASE_URL_FILE=/run/secrets/MONITOR_DATABASE_URL \
            --env AUTH_SECRET_FILE=/run/secrets/AUTH_SECRET --env BOOKING_CAPABILITY_SECRET_FILE=/run/secrets/BOOKING_CAPABILITY_SECRET --env BOOKING_CAPABILITY_KEYRING_FILE=/run/secrets/BOOKING_CAPABILITY_KEYRING \
            --env RATE_LIMIT_HASH_SECRET_FILE=/run/secrets/RATE_LIMIT_HASH_SECRET --env TENANT_CONTEXT_SECRET_FILE=/run/secrets/TENANT_CONTEXT_SECRET --env TOKEN_ENCRYPTION_KEY_FILE=/run/secrets/TOKEN_ENCRYPTION_KEY \
            --env PROXY_SHARED_SECRET_FILE=/run/secrets/PROXY_SHARED_SECRET --env OPERATOR_HEALTH_SECRET_FILE=/run/secrets/OPERATOR_HEALTH_SECRET --env GOOGLE_CLIENT_SECRET_FILE=/run/secrets/GOOGLE_CLIENT_SECRET \
            --env EMAIL_TOKEN_SECRET_FILE=/run/secrets/EMAIL_TOKEN_SECRET --env BLOCKWISE_WEBHOOK_SECRET_FILE=/run/secrets/BLOCKWISE_WEBHOOK_SECRET --env BLOCKWISE_BOOKING_ACTION_SECRET_FILE=/run/secrets/BLOCKWISE_BOOKING_ACTION_SECRET --env STRIPE_SECRET_KEY_FILE=/run/secrets/STRIPE_SECRET_KEY --env STRIPE_WEBHOOK_SECRET_FILE=/run/secrets/STRIPE_WEBHOOK_SECRET --env SMTP_PASSWORD_FILE=/run/secrets/SMTP_PASSWORD \
            snagtime:${GITHUB_SHA} node -e "const fs=require('fs'); for (const n of ['DATABASE_URL','WORKER_DATABASE_URL','MONITOR_DATABASE_URL','AUTH_SECRET','BOOKING_CAPABILITY_SECRET','BOOKING_CAPABILITY_KEYRING','RATE_LIMIT_HASH_SECRET','TENANT_CONTEXT_SECRET','TOKEN_ENCRYPTION_KEY','PROXY_SHARED_SECRET','OPERATOR_HEALTH_SECRET','GOOGLE_CLIENT_SECRET','EMAIL_TOKEN_SECRET','BLOCKWISE_WEBHOOK_SECRET','BLOCKWISE_BOOKING_ACTION_SECRET','STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','SMTP_PASSWORD']) { if (!process.env[n] || process.env[n+'_FILE']) throw new Error('secret file contract failed for '+n); fs.accessSync('/run/secrets/'+n) }"
          ! docker run --rm --user 1001:1001 --volume "$secret_volume:/run/secrets:ro" snagtime:${GITHUB_SHA} node -e "require('fs').readFileSync('/run/secrets/DATABASE_URL')"
          ! docker run --rm --user 1000:1000 --volume "$secret_volume:/run/secrets:ro" --entrypoint node snagtime:${GITHUB_SHA} -e "require('fs').writeFileSync('/run/secrets/readonly-check','denied')"
          cid=$(docker run -d --network "$network" -p 3000:3000 \
            --env NODE_ENV=production \
            --env BUILD_ID=${GITHUB_SHA} \
            --env NEXT_PUBLIC_APP_URL=https://example.invalid/ \
            --env DATABASE_PROVIDER=postgresql \
            --env DATABASE_ROLE=app \
            --env DATABASE_URL_FILE=/run/secrets/DATABASE_URL \
            --env WORKER_DATABASE_URL_FILE=/run/secrets/WORKER_DATABASE_URL --env MONITOR_DATABASE_URL_FILE=/run/secrets/MONITOR_DATABASE_URL \
            --volume "$secret_volume:/run/secrets:ro" \
            --env AUTH_SECRET_FILE=/run/secrets/AUTH_SECRET \
            --env BOOKING_CAPABILITY_KEY_ID=ci-booking-v1 \
            --env BOOKING_CAPABILITY_SECRET_FILE=/run/secrets/BOOKING_CAPABILITY_SECRET \
            --env BOOKING_CAPABILITY_KEYRING_FILE=/run/secrets/BOOKING_CAPABILITY_KEYRING \
            --env RATE_LIMIT_PROVIDER=postgresql \
            --env RATE_LIMIT_HASH_SECRET_FILE=/run/secrets/RATE_LIMIT_HASH_SECRET \
            --env TENANT_CONTEXT_SECRET_FILE=/run/secrets/TENANT_CONTEXT_SECRET \
            --env TOKEN_ENCRYPTION_KEY_FILE=/run/secrets/TOKEN_ENCRYPTION_KEY \
            --env OUTBOX_WORKER_MODE=dedicated \
            --env TRUST_PROXY=true \
            --env PROXY_SHARED_SECRET_FILE=/run/secrets/PROXY_SHARED_SECRET \
            --env OPERATOR_HEALTH_SECRET_FILE=/run/secrets/OPERATOR_HEALTH_SECRET \
            --env EMAIL_TOKEN_SECRET_FILE=/run/secrets/EMAIL_TOKEN_SECRET --env BLOCKWISE_WEBHOOK_SECRET_FILE=/run/secrets/BLOCKWISE_WEBHOOK_SECRET \
            --env DEMO_MODE=false \
            --env NEXT_PUBLIC_FREE_ONLY=true \
            --env PAYMENTS_PROVIDER=stripe \
            --env STRIPE_SECRET_KEY_FILE=/run/secrets/STRIPE_SECRET_KEY \
            --env STRIPE_WEBHOOK_SECRET_FILE=/run/secrets/STRIPE_WEBHOOK_SECRET \
            --env CALENDAR_PROVIDER=google \
            --env GOOGLE_CLIENT_ID=ci-proof.apps.googleusercontent.com \
            --env GOOGLE_CLIENT_SECRET_FILE=/run/secrets/GOOGLE_CLIENT_SECRET \
            --env EMAIL_PROVIDER=smtp \
            --env SMTP_TLS_MODE=starttls \
            --env SMTP_HOST=smtp.invalid --env SMTP_PORT=465 --env SMTP_USER=ci --env SMTP_PASSWORD_FILE=/run/secrets/SMTP_PASSWORD \
            --env EMAIL_TOKEN_SECRET_FILE=/run/secrets/EMAIL_TOKEN_SECRET \
            --env EMAIL_FROM=ci@example.invalid --env EMAIL_REPLY_TO=ci@example.invalid --env EMAIL_SENDER_DOMAIN=example.invalid \
            snagtime:${GITHUB_SHA})
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/ready >/dev/null

      - name: Scan actionable vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969" image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed snagtime:${GITHUB_SHA}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR with ephemeral token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable image
        run: |
          docker buildx build \
            --provenance=mode=max \
            --sbom=true \
            --build-arg BUILD_ID=${GITHUB_SHA} \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --target runtime \
            --push \
            --metadata-file image-metadata.json .
          digest=$(jq -r '.["containerimage.digest"]' image-metadata.json)
          test "$digest" = sha256:* || { echo 'GHCR did not return an immutable digest' >&2; exit 1; }
          printf '%s\n' "$IMAGE@$digest" | tee image-reference.txt

      - name: Upload immutable image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snagtime-image-reference-${{ github.sha }}
          path: image-reference.txt
          if-no-files-found: error
