name: SnagTime container image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests only build and scan. Publishing is possible only from the
# protected repository's main branch and uses the ephemeral GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: snagtime-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-test-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: snagtime_ci
        options: --health-cmd "pg_isready -U postgres -d snagtime_ci" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare TLS PostgreSQL and production schema
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          PG_PORT: ${{ job.services.postgres.ports[5432] }}
          PG_PASSWORD: ci-only-ephemeral
          DATABASE_URL: postgresql://postgres:ci-only-ephemeral@127.0.0.1:${{ job.services.postgres.ports[5432] }}/snagtime_ci?sslmode=verify-full&sslrootcert=${{ github.workspace }}/ci-certs/ca.crt&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000
          WORKER_DATABASE_URL: postgresql://tempocove_worker_login:ci-worker-db-password-0000000000000001@127.0.0.1:${{ job.services.postgres.ports[5432] }}/snagtime_ci?sslmode=verify-full&sslrootcert=${{ github.workspace }}/ci-certs/ca.crt&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000
          TENANT_CONTEXT_SECRET: ci-tenant-context-secret-00000000000001
          TEMPOCOVE_APP_DB_PASSWORD: ci-app-db-password-000000000000000001
          TEMPOCOVE_WORKER_DB_PASSWORD: ci-worker-db-password-0000000000000001
          TEMPOCOVE_MONITOR_DB_PASSWORD: ci-monitor-db-password-000000000000001
          TEMPOCOVE_MIGRATION_DB_PASSWORD: ci-migration-db-password-00000000000001
        run: |
          set -euo pipefail
          mkdir -p ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout ci-certs/ca.key -out ci-certs/ca.crt -subj '/CN=SnagTime CI CA'
          openssl req -newkey rsa:2048 -nodes -keyout ci-certs/server.key -out ci-certs/server.csr -subj '/CN=postgres'
          printf 'subjectAltName=DNS:postgres,DNS:localhost,IP:127.0.0.1\n' > ci-certs/server.ext
          openssl x509 -req -in ci-certs/server.csr -CA ci-certs/ca.crt -CAkey ci-certs/ca.key -CAcreateserial -out ci-certs/server.crt -days 1 -sha256 -extfile ci-certs/server.ext
          chmod 600 ci-certs/server.key ci-certs/ca.key
          docker cp ci-certs/server.crt "$PG_CONTAINER":/var/lib/postgresql/server.crt
          docker cp ci-certs/server.key "$PG_CONTAINER":/var/lib/postgresql/server.key
          docker exec "$PG_CONTAINER" chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          docker exec "$PG_CONTAINER" chmod 600 /var/lib/postgresql/server.key
          docker exec "$PG_CONTAINER" psql -U postgres -d snagtime_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec "$PG_CONTAINER" psql -U postgres -d snagtime_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'"
          docker exec "$PG_CONTAINER" psql -U postgres -d snagtime_ci -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'"
          docker restart "$PG_CONTAINER" >/dev/null
          for attempt in $(seq 1 20); do docker exec "$PG_CONTAINER" pg_isready -U postgres -d snagtime_ci && break || sleep 1; done
          npm install --ignore-scripts --no-audit --no-fund
          npm run db:generate:postgres
          npx prisma migrate deploy --schema prisma/postgresql/schema.prisma
          npm run db:provision:postgres-logins
          node --input-type=module -e "import pg from 'pg'; import fs from 'node:fs'; const c=new pg.Client({connectionString:process.env.WORKER_DATABASE_URL,ssl:{rejectUnauthorized:true,ca:fs.readFileSync('ci-certs/ca.crt','utf8')}}); await c.connect(); await c.query('INSERT INTO \"WorkerHeartbeat\" (\"workerId\",\"lastSeenAt\",\"status\",\"buildId\") VALUES (\$1,clock_timestamp(),\$2,\$3) ON CONFLICT (\"workerId\") DO UPDATE SET \"lastSeenAt\"=EXCLUDED.\"lastSeenAt\",\"status\"=EXCLUDED.\"status\",\"buildId\"=EXCLUDED.\"buildId\"',['ci-worker','IDLE',process.env.GITHUB_SHA]); await c.end();"
        working-directory: ${{ github.workspace }}

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Build immutable runtime image
        run: |
          docker buildx build \
            --load \
            --provenance=false \
            --sbom=false \
            --build-arg BUILD_ID=${GITHUB_SHA} \
            --tag snagtime:${GITHUB_SHA} \
            --target runtime .

      - name: Verify runtime contract
        run: |
          test "$(docker image inspect snagtime:${GITHUB_SHA} --format '{{.Config.User}}')" = '1000:1000'
          test "$(docker image inspect snagtime:${GITHUB_SHA} --format '{{json .Config.Cmd}}')" = '["node","apps/web/server.js"]'
          docker run --rm --entrypoint node snagtime:${GITHUB_SHA} -e "const fs=require('fs'); for (const f of ['apps/web/server.js','dist/worker.mjs','scripts/container-entrypoint.mjs']) { if (!fs.existsSync('/app/'+f)) throw new Error('missing '+f) }"

      - name: Start web runtime and exercise liveness endpoint
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cid=$(docker run -d --network "$(docker inspect "$PG_CONTAINER" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}')" -p 3000:3000 \
            --env NODE_ENV=production \
            --env BUILD_ID=${GITHUB_SHA} \
            --env NEXT_PUBLIC_APP_URL=https://example.invalid/ \
            --env DATABASE_PROVIDER=postgresql \
            --env DATABASE_ROLE=app \
            --env DATABASE_URL='postgresql://tempocove_app_login:ci-app-db-password-000000000000000001@postgres:5432/snagtime_ci?sslmode=verify-full&sslrootcert=/run/secrets/ci-ca&connect_timeout=3&pool_timeout=20&connection_limit=20&statement_timeout=2000' \
            --volume "$GITHUB_WORKSPACE/ci-certs/ca.crt:/run/secrets/ci-ca:ro" \
            --env AUTH_SECRET=ci-auth-secret-00000000000000000000000000000001 \
            --env BOOKING_CAPABILITY_KEY_ID=ci-booking-v1 \
            --env BOOKING_CAPABILITY_SECRET=ci-booking-capability-secret-00000000000000000001 \
            --env RATE_LIMIT_PROVIDER=postgresql \
            --env RATE_LIMIT_HASH_SECRET=ci-rate-limit-hash-secret-0000000000000001 \
            --env TENANT_CONTEXT_SECRET=ci-tenant-context-secret-00000000000001 \
            --env TOKEN_ENCRYPTION_KEY=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff \
            --env OUTBOX_WORKER_MODE=dedicated \
            --env TRUST_PROXY=true \
            --env PROXY_SHARED_SECRET=ci-proxy-shared-secret-000000000000001 \
            --env OPERATOR_HEALTH_SECRET=ci-operator-health-secret-00000001 \
            --env DEMO_MODE=false \
            --env NEXT_PUBLIC_FREE_ONLY=true \
            --env PAYMENTS_PROVIDER=stripe \
            --env CALENDAR_PROVIDER=google \
            --env GOOGLE_CLIENT_ID=ci-proof.apps.googleusercontent.com \
            --env GOOGLE_CLIENT_SECRET=ci-google-client-secret-000001 \
            --env EMAIL_PROVIDER=smtp \
            --env SMTP_TLS_MODE=starttls \
            --env SMTP_HOST=smtp.invalid --env SMTP_PORT=465 --env SMTP_USER=ci --env SMTP_PASSWORD=ci-smtp-password \
            --env EMAIL_TOKEN_SECRET=ci-email-token-secret-0000000000000001 \
            --env EMAIL_FROM=ci@example.invalid --env EMAIL_REPLY_TO=ci@example.invalid --env EMAIL_SENDER_DOMAIN=example.invalid \
            --entrypoint node snagtime:${GITHUB_SHA} apps/web/server.js)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Scan actionable vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969" image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed snagtime:${GITHUB_SHA}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR with ephemeral token
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish immutable image
        run: |
          docker buildx build \
            --provenance=mode=max \
            --sbom=true \
            --build-arg BUILD_ID=${GITHUB_SHA} \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --target runtime \
            --push \
            --metadata-file image-metadata.json .
          digest=$(jq -r '.["containerimage.digest"]' image-metadata.json)
          test "$digest" = sha256:* || { echo 'GHCR did not return an immutable digest' >&2; exit 1; }
          printf '%s\n' "$IMAGE@$digest" | tee image-reference.txt

      - name: Upload immutable image reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snagtime-image-reference-${{ github.sha }}
          path: image-reference.txt
          if-no-files-found: error
