name: snagtime-free-only

# Self-contained deployment for the public free-only mode. Keep this file
# independent from compose.production.yml so paid-provider credentials are
# neither required at interpolation time nor declared as secret objects.
services:
  postgres:
    build: { context: ., dockerfile: infrastructure/postgresql/Dockerfile }
    environment:
      POSTGRES_USER: tempocove_owner
      POSTGRES_DB: tempocove
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_owner_password
    secrets: [postgres_owner_password, postgres_server_cert, postgres_server_key, postgres_ca_cert]
    volumes: [postgres_data:/var/lib/postgresql/18/docker]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tempocove_owner -d tempocove"], interval: 10s, timeout: 5s, retries: 12 }
  web:
    build: { context: ., target: runtime, args: { BUILD_ID: "${BUILD_ID:?set immutable build identity}", NEXT_PUBLIC_FREE_ONLY: "true" } }
    command: ["node", "apps/web/server.js"]
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL_FILE: /run/secrets/app_database_url
      DATABASE_ROLE: app
      FREE_ONLY: "true"
      NEXT_PUBLIC_FREE_ONLY: "true"
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      BOOKING_CAPABILITY_KEY_ID: ${BOOKING_CAPABILITY_KEY_ID:?set booking capability key id}
      BOOKING_CAPABILITY_SECRET_FILE: /run/secrets/booking_capability_secret
      BOOKING_CAPABILITY_KEYRING_FILE: /run/secrets/booking_capability_keyring
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      EMAIL_TOKEN_SECRET_FILE: /run/secrets/email_token_secret
      TENANT_CONTEXT_SECRET_FILE: /run/secrets/tenant_context_secret
      RATE_LIMIT_HASH_SECRET_FILE: /run/secrets/rate_limit_hash_secret
      PROXY_SHARED_SECRET_FILE: /run/secrets/proxy_shared_secret
      OPERATOR_HEALTH_SECRET_FILE: /run/secrets/operator_health_secret
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set canonical HTTPS origin}
      RATE_LIMIT_PROVIDER: postgresql
      OUTBOX_WORKER_MODE: dedicated
      OUTBOX_WORKER_ENABLED: "false"
      TRUST_PROXY: "true"
      DEMO_MODE: "false"
      EMAIL_PROVIDER: smtp
      CALENDAR_PROVIDER: local
      PAYMENTS_PROVIDER: stub
      BUILD_ID: ${BUILD_ID:?set immutable build identity}
      SMTP_HOST: ${SMTP_HOST:?set SMTP host}
      SMTP_PORT: ${SMTP_PORT:?set SMTP port}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:?set implicit or starttls}
      SMTP_USER: ${SMTP_USER:?set SMTP user}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_FROM: ${EMAIL_FROM:?set sender}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?set system reply address}
      EMAIL_SENDER_DOMAIN: ${EMAIL_SENDER_DOMAIN:?set authorized sender domain}
      BLOCKWISE_WEBHOOK_URL: ${BLOCKWISE_WEBHOOK_URL:-}
      BLOCKWISE_WEBHOOK_SECRET_FILE: /run/secrets/blockwise_webhook_secret
    secrets: [app_database_url, postgres_ca_cert, auth_secret, booking_capability_secret, booking_capability_keyring, token_encryption_key, email_token_secret, tenant_context_secret, rate_limit_hash_secret, proxy_shared_secret, operator_health_secret, smtp_password, blockwise_webhook_secret]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
    healthcheck: { test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 4s, retries: 6 }
  worker:
    build: { context: ., target: runtime, args: { BUILD_ID: "${BUILD_ID:?set immutable build identity}", NEXT_PUBLIC_FREE_ONLY: "true" } }
    command: ["node", "dist/worker.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_ROLE: worker
      WORKER_DATABASE_URL_FILE: /run/secrets/worker_database_url
      TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/token_encryption_key
      EMAIL_TOKEN_SECRET_FILE: /run/secrets/email_token_secret
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set canonical HTTPS origin}
      OUTBOX_WORKER_MODE: dedicated
      OUTBOX_WORKER_ENABLED: "false"
      EMAIL_PROVIDER: smtp
      CALENDAR_PROVIDER: local
      PAYMENTS_PROVIDER: stub
      FREE_ONLY: "true"
      NEXT_PUBLIC_FREE_ONLY: "true"
      BUILD_ID: ${BUILD_ID:?set immutable build identity}
      SMTP_HOST: ${SMTP_HOST:?set SMTP host}
      SMTP_PORT: ${SMTP_PORT:?set SMTP port}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:?set implicit or starttls}
      SMTP_USER: ${SMTP_USER:?set SMTP user}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      EMAIL_FROM: ${EMAIL_FROM:?set sender}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:?set system reply address}
      EMAIL_SENDER_DOMAIN: ${EMAIL_SENDER_DOMAIN:?set authorized sender domain}
      BLOCKWISE_WEBHOOK_URL: ${BLOCKWISE_WEBHOOK_URL:-}
      BLOCKWISE_WEBHOOK_SECRET_FILE: /run/secrets/blockwise_webhook_secret
    secrets: [worker_database_url, postgres_ca_cert, token_encryption_key, email_token_secret, smtp_password, blockwise_webhook_secret]
    depends_on: { postgres: { condition: service_healthy } }
    restart: unless-stopped
secrets:
  postgres_owner_password: { external: true }
  app_database_url: { external: true }
  worker_database_url: { external: true }
  postgres_server_cert: { external: true }
  postgres_server_key: { external: true }
  postgres_ca_cert: { external: true }
  auth_secret: { external: true }
  booking_capability_secret: { external: true }
  booking_capability_keyring: { external: true }
  token_encryption_key: { external: true }
  email_token_secret: { external: true }
  tenant_context_secret: { external: true }
  rate_limit_hash_secret: { external: true }
  proxy_shared_secret: { external: true }
  operator_health_secret: { external: true }
  smtp_password: { external: true }
  blockwise_webhook_secret: { external: true }
volumes:
  postgres_data: {}
